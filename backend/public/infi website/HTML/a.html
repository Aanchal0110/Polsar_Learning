<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Editor</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      .toolbar {
        margin-bottom: 10px;
      }
      button {
        margin-right: 5px;
        padding: 5px 10px;
        border: none;
        cursor: pointer;
        background-color: #f0f0f0;
        transition: background-color 0.3s;
      }
      button.active {
        background-color: #007bff;
        color: white;
      }
      #editor {
        width: 100%;
        height: 300px;
        border: 1px solid #ccc;
        padding: 10px;
        outline: none;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button onclick="toggleActive(this); formatText('bold')">Bold</button>
      <button onclick="toggleActive(this); formatText('italic')">Italic</button>
      <button onclick="toggleActive(this); formatText('underline')">
        Underline
      </button>
      <button onclick="toggleActive(this); formatText('insertOrderedList')">
        OL
      </button>
      <button onclick="toggleActive(this); formatText('insertUnorderedList')">
        UL
      </button>
      <button onclick="toggleActive(this); formatText('h1')">H1</button>
      <button onclick="toggleActive(this); formatText('h2')">H2</button>
      <button onclick="toggleActive(this); formatText('h3')">H3</button>
      <input
        type="color"
        id="colorPicker"
        onchange="formatColor()"
        title="Choose font color"
      />
      <input
        type="file"
        accept="image/*"
        onchange="insertImage(event)"
        title="Upload image"
      />
    </div>
    <div id="editor" contenteditable="true"></div>
    <script>
      function formatText(command) {
        if (command === "h1" || command === "h2" || command === "h3") {
          document.execCommand("formatBlock", false, "<" + command + ">");
        } else {
          document.execCommand(command, false, null);
        }
      }

      function formatColor() {
        let color = document.getElementById("colorPicker").value;
        document.execCommand("styleWithCSS", false, true);
        document.execCommand("foreColor", false, color);
      }

      function insertImage(event) {
        const file = event.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function (e) {
            document.execCommand("insertImage", false, e.target.result);
          };
          reader.readAsDataURL(file);
        }
      }

      function toggleActive(button) {
        button.classList.toggle("active");
      }
    </script>
  </body>
</html>
