<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <style>
      /* Google Font */
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap");

      body {
        font-family: "Poppins", sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: url("https://source.unsplash.com/1600x900/?technology,office")
          no-repeat center center/cover;
      }

      .container {
        background: rgba(255, 255, 255, 0.9);
        padding: 20px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        border-radius: 15px;
        width: 400px;
        text-align: center;
        animation: fadeIn 1s ease-in-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      h2 {
        margin-bottom: 10px;
        color: #007bff;
      }

      input,
      textarea {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
        transition: all 0.3s ease-in-out;
      }

      input:focus,
      textarea:focus {
        border-color: #007bff;
        box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        transform: scale(1.02);
      }

      button {
        background: #007bff;
        color: white;
        padding: 12px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        width: 100%;
        transition: all 0.3s;
      }

      button:hover {
        background: #0056b3;
        transform: scale(1.05);
      }

      .info {
        margin-top: 20px;
        font-size: 14px;
        color: #333;
      }

      .map-container {
        margin-top: 20px;
        border-radius: 10px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>GET IN TOUCH WITH US</h2>
      <form>
        <input type="text" placeholder="Full Name" required /><br />
        <input type="email" placeholder="Email" required /><br />
        <input type="tel" placeholder="Phone number" required /><br />
        <textarea placeholder="Message" rows="4" required></textarea><br />
        <button type="submit">Submit</button>
      </form>

      <div class="info">
        <p>
          <strong>Address:</strong> Vidyalankar Institute of Technology,
          Vidyalankar College Marg, Wadala (E), Mumbai — 400 037
        </p>
        <p><strong>Phone:</strong> +91 22 2416 11 26</p>
      </div>

      <!-- Google Map -->
      <div class="map-container">
        <iframe
          width="100%"
          height="250"
          frameborder="0"
          style="border: 0; border-radius: 10px"
          allowfullscreen
          src="https://www.google.com/maps/embed/v1/place?q=Vidyalankar%20Institute%20of%20Technology%2C%20Mumbai&key=YOUR_GOOGLE_MAPS_API_KEY"
        >
        </iframe>
      </div>
    </div>
  </body>
</html>
