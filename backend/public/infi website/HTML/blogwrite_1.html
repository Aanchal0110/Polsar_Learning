<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Write a Blog Post</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 0;
      }

      .container {
        width: 60%;
        margin: auto;
        padding: 20px;
        background: #fff;
        margin-top: 50px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      h2 {
        text-align: center;
      }

      .form-group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }

      input[type="text"],
      input[type="file"] {
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      #editor-toolbar {
        margin-bottom: 10px;
        border: 1px solid #ccc;
        padding: 5px;
        background: #f0f0f0;
      }

      #editor-toolbar button,
      #editor-toolbar select,
      #editor-toolbar input[type="color"] {
        margin-right: 5px;
        padding: 5px;
      }

      #content {
        min-height: 200px;
        border: 1px solid #ccc;
        padding: 10px;
        border-radius: 4px;
        background: #fff;
        overflow-y: auto;
      }

      button[type="submit"] {
        background-color: #28a745;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
      }

      button[type="submit"]:hover {
        background-color: #218838;
      }

      #preview {
        margin-top: 30px;
      }

      #preview h3 {
        font-size: 22px;
        color: #333;
      }

      #preview-title {
        font-size: 20px;
        font-weight: bold;
      }

      #preview-content {
        font-size: 16px;
        margin: 10px 0;
      }

      #preview-tags {
        font-style: italic;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Write Your Blog</h2>
      <form id="blog-form" method="post" action="/blog/write_blog/send_blog">
        <div class="form-group">
          <label for="title">Blog Title</label>
          <input
            type="text"
            id="title"
            placeholder="Enter your blog title"
            name="text_title"
            required
          />
        </div>

        <div class="form-group">
          <label>Blog Content</label>
          <div id="editor-toolbar">
            <button type="button" onclick="execCmd('bold')"><b>B</b></button>
            <button type="button" onclick="execCmd('italic')"><i>I</i></button>
            <button type="button" onclick="execCmd('underline')">
              <u>U</u>
            </button>
            <button type="button" onclick="execCmd('justifyLeft')">Left</button>
            <button type="button" onclick="execCmd('justifyCenter')">
              Center
            </button>
            <button type="button" onclick="execCmd('justifyRight')">
              Right
            </button>
            <button type="button" onclick="execCmd('insertUnorderedList')">
              • List
            </button>
            <input
              type="color"
              onchange="execCmdWithArg('foreColor', this.value)"
            />
          </div>
          <div id="content" contenteditable="true" name="text_blog"></div>
        </div>

        <div class="form-group">
          <label for="tags">Tags (comma-separated)</label>
          <input
            type="text"
            id="tags"
            placeholder="e.g., microwave, remote sensing, education"
            name="text_tags"
          />
        </div>

        <div class="form-group">
          <label for="image">Upload Cover Image</label>
          <input type="file" id="image" accept="image/*" />
        </div>

        <!-- Hidden input to store HTML content -->
        <input type="hidden" name="text_blog_html" id="text_blog_html" />

        <button type="submit">Submit Blog</button>
      </form>

      <div id="preview">
        <h3>Blog Preview</h3>
        <h4 id="preview-title"></h4>
        <div id="preview-content"></div>
        <p id="preview-tags"></p>
      </div>
    </div>

    <script>
      function execCmd(command) {
        document.execCommand(command, false, null);
      }

      function execCmdWithArg(command, arg) {
        document.execCommand(command, false, arg);
      }

      document
        .getElementById("blog-form")
        .addEventListener("submit", function (event) {
          // Store the HTML content into hidden input
          const contentHtml = document.getElementById("content").innerHTML;
          document.getElementById("text_blog_html").value = contentHtml;

          // Show preview
          const title = document.getElementById("title").value;
          const tags = document.getElementById("tags").value;

          document.getElementById("preview-title").innerText = title;
          document.getElementById("preview-content").innerHTML = contentHtml;
          document.getElementById("preview-tags").innerText = `Tags: ${tags}`;

          // To prevent page reload during preview
          event.preventDefault();
        });
    </script>
  </body>
</html>
