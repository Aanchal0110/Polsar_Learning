<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parallax Scroll Animation</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      /* Full Page Scroll Effect */
      body {
        background-color: #121212;
        height: 250vh; /* Ensure scrolling space */
        overflow-x: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
      }

      /* Background Typography */
      .background-text {
        position: absolute;
        top: 30%;
        left: 5%;
        font-size: 180px;
        font-weight: bold;
        color: rgba(200, 150, 255, 0.3);
        font-family: "Georgia", serif;
        z-index: -1;
      }

      /* Container for images */
      .container {
        position: relative;
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Image Styling */
      .image {
        width: 300px;
        height: auto;
        position: absolute;
        opacity: 0;
        transition: opacity 1s ease-out, transform 1.5s ease-out;
      }

      /* Initial Positions */
      .image1 {
        top: -100px;
        left: 15%;
        transform: translateY(-50px);
      } /* Top Left */
      .image2 {
        top: 20%;
        left: 50%;
        transform: translateY(50px) translateX(-50%);
      } /* Center */
      .image3 {
        bottom: -100px;
        right: 15%;
        transform: translateY(50px);
      } /* Bottom Right */

      /* Final Positions After Scrolling */
      .show {
        opacity: 1;
        transform: translateY(0);
      }

      /* Header Text */
      .header {
        position: absolute;
        top: 5%;
        right: 5%;
        color: white;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <span>Digital Designer</span> <br />
      <span>MARCH 16, 2025</span>
    </div>

    <div class="background-text">About</div>

    <div class="container">
      <img src="/infi website/image/image.png" class="image image1" />
      <img src="/infi website/image/image.png" class="image image2" />
      <img src="/infi website/image/image.png" class="image image3" />
    </div>

    <script>
      const images = document.querySelectorAll(".image");

      function revealImages() {
        let scrollPosition = window.scrollY + window.innerHeight * 0.8;

        images.forEach((img) => {
          if (img.offsetTop < scrollPosition) {
            img.classList.add("show");
          }
        });
      }

      window.addEventListener("scroll", revealImages);
      revealImages(); // Trigger animation on page load
    </script>
  </body>
</html>
