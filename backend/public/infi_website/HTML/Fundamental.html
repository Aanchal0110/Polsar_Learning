<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POLARIMETRY - PolSARLearn</title>
    <!-- Font Awesome CDN Link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <!-- Custom CSS File Link -->
    <link rel="stylesheet" href="/infi_website/CSS/style.css" />
    <style>
      body {
        /* font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; */
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        color: #333;
        line-height: 1.6;
      }

      /* Container adjustment for fixed header */
      .container {
        max-width: 1400px;
        margin: 100px auto 20px auto;
        padding: 20px;
        background: transparent;
      }

      /* Hero Section */
      .hero-section {
        background: linear-gradient(135deg, #003366 0%, #004080 100%);
        color: white;
        padding: 60px 40px;
        border-radius: 20px;
        text-align: center;
        margin-bottom: 40px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      .hero-section h1 {
        font-size: 3.5em;
        margin: 0 0 20px 0;
        font-weight: 700;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        letter-spacing: 2px;
      }

      .hero-section p {
        font-size: 1.3em;
        margin: 0;
        opacity: 0.9;
        max-width: 800px;
        margin: 0 auto;
      }

      /* Search Section */
      .search-section {
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        margin-bottom: 40px;
        text-align: center;
      }

      .search-container {
        position: relative;
        max-width: 500px;
        margin: 0 auto;
      }

      .search-input {
        width: 100%;
        padding: 15px 20px;
        font-size: 1.1em;
        border: 2px solid #e1e5e9;
        border-radius: 50px;
        outline: none;
        transition: all 0.3s ease;
        box-sizing: border-box;
      }

      .search-input:focus {
        border-color: #003366;
        box-shadow: 0 0 0 3px rgba(0, 51, 102, 0.1);
      }

      .search-icon {
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        color: #666;
        font-size: 1.2em;
      }

      /* Cards Grid */
      .cards-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
        gap: 30px;
        margin-top: 40px;
        /* width: 80vw; */
      }

      .card {
        background: white;
        border-radius: 20px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        transition: all 0.3s ease;
        border: 1px solid #e1e5e9;
      }

      .card:hover {
        transform: translateY(-10px);
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
      }

      .card-image {
        width: 100%;
        height: 250px;
        object-fit: cover;
        transition: transform 0.3s ease;
      }

      .card:hover .card-image {
        transform: scale(1.05);
      }

      .card-content {
        padding: 30px;
      }

      .card-title {
        font-size: 1.4em;
        color: #003366;
        margin: 0 0 15px 0;
        font-weight: 600;
        line-height: 1.3;
        border-bottom: 3px solid #ff4500;
        padding-bottom: 10px;
        display: inline-block;
      }

      .card-description {
        color: #555;
        font-size: 1em;
        line-height: 1.7;
        margin-bottom: 20px;
      }

      .card-description.expanded {
        display: block;
      }

      .card-description.collapsed {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .read-more-btn {
        background: linear-gradient(135deg, #003366 0%, #004080 100%);
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 25px;
        cursor: pointer;
        font-size: 0.95em;
        font-weight: 500;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .read-more-btn:hover {
        background: linear-gradient(135deg, #004080 0%, #0056b3 100%);
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 51, 102, 0.3);
      }

      .read-more-btn i {
        font-size: 0.9em;
        transition: transform 0.3s ease;
      }

      .read-more-btn:hover i {
        transform: translateX(3px);
      }

      /* Category Filters */
      .category-filters {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 30px;
        flex-wrap: wrap;
      }

      .filter-btn {
        background: white;
        border: 2px solid #e1e5e9;
        color: #555;
        padding: 10px 20px;
        border-radius: 25px;
        cursor: pointer;
        font-size: 0.95em;
        font-weight: 500;
        transition: all 0.3s ease;
      }

      .filter-btn:hover,
      .filter-btn.active {
        background: #003366;
        color: white;
        border-color: #003366;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 51, 102, 0.2);
      }

      /* Responsive Design */
      @media (max-width: 768px) {
        .hero-section {
          padding: 40px 20px;
        }

        .hero-section h1 {
          font-size: 2.5em;
        }

        .hero-section p {
          font-size: 1.1em;
        }

        .cards-grid {
          grid-template-columns: 1fr;
          gap: 20px;
        }

        .card-content {
          padding: 20px;
        }

        .category-filters {
          gap: 10px;
        }

        .filter-btn {
          padding: 8px 16px;
          font-size: 0.9em;
        }

        .search-input {
          padding: 12px 16px;
          font-size: 1em;
        }
      }

      @media (max-width: 480px) {
        .container {
          padding: 10px;
        }

        .hero-section {
          padding: 30px 15px;
        }

        .hero-section h1 {
          font-size: 2em;
        }

        .search-section {
          padding: 20px;
        }
      }

      /* Animation for cards */
      .card {
        animation: fadeInUp 0.6s ease forwards;
        opacity: 0;
        transform: translateY(30px);
      }

      .card:nth-child(1) { animation-delay: 0.1s; }
      .card:nth-child(2) { animation-delay: 0.2s; }
      .card:nth-child(3) { animation-delay: 0.3s; }
      .card:nth-child(4) { animation-delay: 0.4s; }
      .card:nth-child(5) { animation-delay: 0.5s; }
      .card:nth-child(6) { animation-delay: 0.6s; }

      @keyframes fadeInUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Page Title Styling */
      .page-title {
        font-size: 3.5em;
        color: #003366;
        text-align: center;
        margin: 0 0 30px 0;
        font-weight: 700;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        letter-spacing: 2px;
        background: linear-gradient(135deg, #003366 0%, #004080 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        padding: 20px 0;
      }

      .page-title i {
        margin-right: 15px;
        color: #ff4500;
        -webkit-text-fill-color: #ff4500;
      }

      /* Loading state */
      .loading {
        text-align: center;
        padding: 40px;
        color: #666;
      }

      .loading i {
        font-size: 2em;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

      <div id="menu" class="fas fa-bars"></div>

              <!-- Search Section -->
        <section class="search-section">

          <div class="search-container">
        <input
          type="text"
            class="search-input" 
            id="searchInput" 
            placeholder="Search polarimetry concepts..."
          onkeyup="filterCards()"
        />
          <i class="fas fa-search search-icon"></i>
      </div>

        <!-- Category Filters -->
        <div class="category-filters">
          <button class="filter-btn active" onclick="filterByCategory('all')">All Topics</button>
          <button class="filter-btn" onclick="filterByCategory('radar')">Radar Basics</button>
          <button class="filter-btn" onclick="filterByCategory('polarization')">Polarization</button>
          <button class="filter-btn" onclick="filterByCategory('processing')">Processing</button>
          <button class="filter-btn" onclick="filterByCategory('applications')">Applications</button>
        </div>
      </section>

      <!-- Cards Grid -->
      <div class="cards-grid" id="cardsGrid">
      </div>
    </div>

    <script>

      fetch(`https://${window.location.host}/infi_website/data/fundamental.json`).then(res => res.json()).then(data => {
        Object.keys(data).forEach((k, index) => {
          // console.log(data[k])
          const card = `
          
          <div class="card" data-category="radar">
          <div class="card-content">
            <h3 class="card-title">${data[k].title}</h3>
            <div class="card-description collapsed" id="desc1">
            ${data[k].intro}
            </div>
            <div class="card-description expanded" id="desc1-full" style="display: none;">
            ${data[k].content}
             </div>
            <button class="read-more-btn" onclick="toggleDescription(1)">
              <span>Read more</span>
              <i class="fas fa-chevron-down"></i>
            </button>
          </div>
        </div>`;
          document.getElementById("cardsGrid").innerHTML += card;  
      })
      }).catch(err => console.error(err));


      // Toggle description visibility
      function toggleDescription(cardId) {
        const collapsedDesc = document.getElementById(`desc${cardId}`);
        const expandedDesc = document.getElementById(`desc${cardId}-full`);
        const button = event.target.closest('.read-more-btn');
        const buttonText = button.querySelector('span');
        const buttonIcon = button.querySelector('i');

        if (expandedDesc.style.display === 'none') {
          collapsedDesc.style.display = 'none';
          expandedDesc.style.display = 'block';
          buttonText.textContent = 'Read less';
          buttonIcon.className = 'fas fa-chevron-up';
        } else {
          collapsedDesc.style.display = 'block';
          expandedDesc.style.display = 'none';
          buttonText.textContent = 'Read more';
          buttonIcon.className = 'fas fa-chevron-down';
        }
      }
