<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POLSAR Authentication</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-image: url("../image/login2.jpg");
        background-size: cover;
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-position: center;
        color: #50237a;
      }

      #box {
        background-color: rgba(255, 255, 255, 0.9);
        width: 400px;
        padding: 40px 30px;
        border-radius: 10px;
        text-align: center;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      #box h2 {
        margin: 0 0 15px;
        color: #960d0d;
      }

      .text {
        height: 30px;
        border-radius: 5px;
        padding: 10px;
        border: 1px solid #ccc;
        width: 100%;
        margin-bottom: 15px;
        box-sizing: border-box;
        color: #333;
        background-color: #fff;
      }

      .button {
        padding: 12px 20px;
        width: 100%;
        color: white;
        background-color: #5a2360;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        transition: background-color 0.3s;
      }

      #button:hover {
        background-color: #3d1747;
      }

      #box a {
        color: #6a0dad;
        text-decoration: none;
        font-weight: bold;
        margin-top: 15px;
        display: inline-block;
        cursor: pointer;
      }

      .social-login {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
      }

      .social-login button {
        width: 32%;
        padding: 10px;
        font-size: 14px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      .google {
        background-color: #dd4b39;
        color: white;
      }

      .microsoft {
        background-color: #2b579a;
        color: white;
      }

      .apple {
        background-color: black;
        color: white;
      }

      /* Form visibility controls */
      .form-container {
        display: none;
      }

      .form-container.active {
        display: block;
      }
      #home-button {
        position: absolute;
        top: 20px;
        left: 20px;
        padding: 10px 20px;
        font-size: 16px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        text-decoration: none;
        transition: background-color 0.3s;
      }

      #home-button:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <a href="/infi_website/HTML/home.html" id="home-button">Home</a>

    <div id="box">
      <h2 id="formTitle">Login</h2>

      <!-- Login Form -->
      <div id="loginForm" class="form-container active">
        <form method="post">
          <input
            class="text"
            type="text"
            name="user_name"
            placeholder="Enter User Name"
            required
          />
          <br />
          <input
            class="text"
            type="password"
            name="password"
            placeholder="Enter Password"
            required
          />
          <br />
          <input id="login_button" class="button" type="submit" value="Login" />
          <br />
        </form>
        <a id="showSignup">Click to Signup</a>
        <p id="loginMessage" style="color: red"></p>
      </div>

      <!-- Signup Form -->
      <div id="signupForm" class="form-container">
        <form method="post">
          <input
            id="signup_first_name"
            class="text"
            type="text"
            name="first_name"
            placeholder="Enter First Name"
            required
          />
          <br />
          <input
            id="signup_last_name"
            class="text"
            type="text"
            name="last_name"
            placeholder="Enter Last Name"
            required
          />
          <br />
          <input
            id="signup_email"
            class="text"
            type="email"
            name="email"
            placeholder="Enter Email"
            required
          />
          <br />
          <input
            class="text"
            type="tel"
            name="phone"
            placeholder="Enter Phone"
            pattern="[0-9]{10}"
            required
            title="Phone number must be 10 digits"
          />
          <br />
          <input
            id="signup_password_1"
            class="text"
            type="password"
            name="password"
            placeholder="Enter Password"
            minlength="8"
            required
            pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[\W_]).{8,}"
            title="Must contain at least one number, one uppercase and lowercase letter, and one special character."
          />
          <br />
          <input id="signup_btn" class="button" type="submit" value="Signup" />
          <br />
        </form>
        <a id="showLogin">Click to Login</a>
      </div>

      <!-- Social Login Buttons -->
      <div class="social-login">
        <button class="google" id="googleLogin">Google</button>
        <button class="microsoft" id="microsoftLogin">Microsoft</button>
        <button class="apple" id="appleLogin">Apple</button>
      </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
      // Import the functions you need from the SDKs you need
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-analytics.js";
      import {
        getAuth,
        GoogleAuthProvider,
        OAuthProvider,
        signInWithPopup,
      } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAMz26OAAgh3PTfOr4grMoUkXLuNY_nti8",
        authDomain: "polsar-learn.firebaseapp.com", // This must match your Firebase project
        projectId: "polsar-learn",
        storageBucket: "polsar-learn.appspot.com",
        messagingSenderId: "720070143478",
        appId: "1:720070143478:web:fd81b5226592ab19746bd7",
        measurementId: "G-XLG559EVMK",
      };

      // Initialize Firebase
      const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);
      const auth = getAuth();

      // Google Sign-In
      async function signInWithGoogle() {
        const provider = new GoogleAuthProvider();
        try {
          const result = await signInWithPopup(auth, provider);
          const user = result.user;
          console.log("User:", user);
          // Handle successful login
        } catch (error) {
          console.error("Error during Google Sign-In:", error);
          alert(`Error during Google Sign-In: ${error.message}`);
        }
      }

      // Microsoft Sign-In
      async function signInWithMicrosoft() {
        const provider = new OAuthProvider("microsoft.com");
        try {
          const result = await signInWithPopup(auth, provider);
          const user = result.user;
          console.log("User:", user);
          // Handle successful login
        } catch (error) {
          console.error("Error during Microsoft Sign-In:", error);
          alert(`Error during Microsoft Sign-In: ${error.message}`);
        }
      }

      document
        .getElementById("googleLogin")
        .addEventListener("click", function () {
          signInWithGoogle();
        });

      document
        .getElementById("microsoftLogin")
        .addEventListener("click", function () {
          signInWithMicrosoft();
        });

      // Show Signup form and hide Login form
      document
        .getElementById("showSignup")
        .addEventListener("click", function () {
          document.getElementById("loginForm").classList.remove("active");
          document.getElementById("signupForm").classList.add("active");
          document.getElementById("formTitle").innerText = "Signup";
        });

      // Show Login form and hide Signup form
      document
        .getElementById("showLogin")
        .addEventListener("click", function () {
          document.getElementById("signupForm").classList.remove("active");
          document.getElementById("loginForm").classList.add("active");
          document.getElementById("formTitle").innerText = "Login";
        });
    </script>
    <!-- <script src="/infi_website/Javascript/script.js"></script> -->
    <script type="module" src="/infi_website/Javascript/navBar.js"></script>
    <script type="module" src="/infi_website/Javascript/authLogin.js"></script>
    <script type="module" src="/infi_website/Javascript/authSignup.js"></script>
  </body>
</html>
