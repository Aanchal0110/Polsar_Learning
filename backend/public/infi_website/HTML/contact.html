<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - PolSARLearn</title>
    <!-- Font Awesome CDN Link -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <!-- Custom CSS File Link -->
    <link rel="stylesheet" href="/infi_website/CSS/style.css" />
    <style>
      html { 
        background: transparent !important; 
        height: 100%;
      }
      body {
        font-family: 'Segoe UI', Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: rgba(255, 255, 255, 0.9) url('/infi_website/Cover image/cover images/Satellite.png') no-repeat center center fixed;
        background-size: cover;
        background-blend-mode: lighten;
        color: #333;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      
      .contact-container { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; max-width: 720px; margin: 1.5rem auto; padding: 1.2rem; background:#fff; border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,.08); }
      
      .contact-form, .map-container { padding: 1rem; background:#fff; border-radius: 10px; border: 1px solid #e6e6e6; }
      
      h2 { color: #2c3e50; text-align: center; margin: 1.2rem 0; font-size: 1.8rem; font-weight: 700; }
      
      .form-group {
        margin-bottom: 1.5rem;
        text-align: left;
      }
      
      label {
        display: block;
        margin-bottom: 0.5rem;
        color: #333;
        font-weight: 600;
      }
      
      input, textarea { width: 100%; padding: 10px 12px; border: 1px solid #dcdcdc; border-radius: 8px; font-size: 0.95rem; transition: box-shadow 0.2s, border-color 0.2s; }
      
      input:focus,
      textarea:focus {
        outline: none;
        border-color: #3498db;
        box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
      }
      
      textarea {
        min-height: 150px;
        resize: vertical;
      }
      
      button { background: #003366; color: #fff; border: none; padding: 12px 16px; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: 600; width: 100%; transition: background-color 0.2s, transform 0.05s; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
      
      button:hover {
        background: #1a252f;
      }
      
      button:active {
        transform: translateY(0);
      }
      
      .map-container iframe { width: 100%; height: 100%; min-height: 360px; border: none; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
      
      .contact-info { margin-top: 1rem; text-align: center; color: #333; }
      
      .contact-info a { color: #ff4500; text-decoration: none; font-weight: 700; transition: color 0.2s; }
      
      .contact-info a:hover {
        color: #2980b9;
        text-decoration: underline;
      }
      
      @media (max-width: 768px) { .contact-container { grid-template-columns: 1fr; padding: 1rem; } }
      h2 {
        margin-bottom: 15px;
        color: #ffffff; /* visible on image background */
      }
      label {
        font-weight: bold;
        display: block;
        margin-top: 10px;
      }
      input,
      textarea {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 12px;
        background: #5a2360;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        transition: background-color 0.3s;
        margin-top: 15px;
      }
      button:hover {
        background: #3d1747;
      }
      .contact-info {
        margin-top: 20px;
        font-size: 16px;
        color: #ffffff;
      }
      .contact-info a {
        color: #ff4500;
        font-weight: 600;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <header>
      <div id="menu" class="fas fa-bars"></div>
      <div id="navBar"></div>
    </header>
    <h2>Get In Touch</h2>
    <div class="contact-container">
      <div class="contact-form">
        <form id="contactForm" onsubmit="submitForm(event)">
          <div class="form-group">
            <label for="name">Your Name</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Enter your name"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <div class="form-group">
            <label for="subject">Subject</label>
            <input
              type="text"
              id="subject"
              name="subject"
              placeholder="What's this about?"
              required
            />
          </div>

          <div class="form-group">
            <label for="message">Your Message</label>
            <textarea
              id="message"
              name="message"
              rows="5"
              placeholder="How can we help you?"
              required
            ></textarea>
          </div>

          <button type="submit"><i class="fas fa-paper-plane"></i> Send Message</button>
        </form>
      </div>

      <div class="map-container">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d30179.662189630035!2d72.81910927578703!3d18.99953956009401!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3be7cef075572aa5%3A0x2bbb2fa3b7814b7a!2sInfiCorridor%20Solutions%20Private%20Limited!5e0!3m2!1sen!2sin!4v1754476760784!5m2!1sen!2sin"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
        
        <div class="contact-info">
          <p><i class="fas fa-envelope"></i> <a href="mailto:scientific@inficorridor.in">scientific@inficorridor.in</a></p>
          <p><i class="fas fa-map-marker-alt"></i> InfiCorridor Solutions Private Limited, Mumbai, India</p>
        </div>
      </div>
    </div>

    <script>
      async function submitForm(event) {
        event.preventDefault();
        
        const form = event.target;
        const formData = new FormData(form);
        const payload = Object.fromEntries(formData.entries());
        const submitButton = form.querySelector('button[type="submit"]');
        const originalButtonText = submitButton.innerHTML;
        
        try {
          // Disable button and show loading state
          submitButton.disabled = true;
          submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
          
          // Send to backend
          const res = await fetch('/auth/contact', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          if (!res.ok) throw new Error('Failed to send');
          
          // Show success message
          alert('Thank you for your message! We will get back to you soon.');
          form.reset();
          
        } catch (error) {
          console.error('Error submitting form:', error);
          alert('There was an error sending your message. Please try again later.');
        } finally {
          // Reset button state
          submitButton.disabled = false;
          submitButton.innerHTML = originalButtonText;
        }
      }
    </script>
    <script type="module" src="/infi_website/Javascript/navBar.js"></script>
  </body>
</html>
