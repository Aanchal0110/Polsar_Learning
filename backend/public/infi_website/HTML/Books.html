<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Books - Learn RS & MW</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <link rel="stylesheet" href="/infi_website/CSS/style.css" />
  </head>
  <body>
    <header>
      <div id="menu" class="fas fa-bars"></div>
      <div id="navBar"></div>
    </header>
    <main>
      <h1>Books</h1>
      <div class="search-bar">
        <input
          type="text"
          id="bookSearch"
          placeholder="Search by title, author, or keyword..."
          onkeyup="filterCards()"
        />
      </div>
      <div class="card-container" id="cardContainer">
        <!-- Cards will be dynamically injected -->
      </div>
    </main>
    <script>
      const books = [
        {
          title: "Introduction to Remote Sensing",
          author: "Arthur P. Cracknell",
          beginnerNote:
            "Perfect for those new to remote sensing. Starts with the basics, uses clear language and real-world examples. No advanced math required. You'll learn what remote sensing is, how satellites and sensors work, and how scientists use images to study the Earth.",
          desc: "Physical principles, satellite systems, lidar, SAR applications. A comprehensive guide to satellite remote sensing techniques, image interpretation, and current applications in Earth observation.",
          img: "../BOOKS image/Introduction to remote sending.jpg",
          link: "https://www.goodreads.com/book/show/1814302.Introduction_to_Remote_Sensing",
        },
        {
          title: "Remote Sensing: Principles and Applications",
          author: "B C Panda",
          beginnerNote:
            "A great introduction for students and professionals. Explains the core ideas behind remote sensing with simple language and practical examples. No prior experience needed.",
          desc: "Core principles, sensor technologies, data interpretation. Detailed exploration of electromagnetic theory, sensor design, and practical case studies across varied environments.",
          img: "../BOOKS image/principle of remote sensing.jpg",
          link: "https://www.goodreads.com/book/show/15728213-remote-sensing",
        },
        {
          title: "Microwave Remote Sensing",
          author: "Fawwaz Ulaby",
          beginnerNote:
            "Best for those who want to understand microwave sensing. The book is detailed but starts from the basics, making it accessible to motivated beginners interested in radar and environmental applications.",
          desc: "Comprehensive series on microwave sensing, radar backscatter models, and passive/active systems used in environmental observation and analysis.",
          img: "../BOOKS image/Microwave Radar and Radiometric Remote Sensing.jpg",
          link: "https://www.goodreads.com/book/show/1804307.Microwave_Remote_Sensing",
        },
        {
          title: "Fundamentals of Remote Sensing",
          author: "George Joseph",
          beginnerNote:
            "Covers the basics of remote sensing, data processing, and sensors. Written in a clear style, it's suitable for undergraduates and anyone curious about how remote sensing works in India and globally.",
          desc: "Basic concepts of remote sensing, data processing, sensor details, and its applications in Indian and global contexts.",
          img: "../BOOKS image/Introduction to the physical and techniques.jpg",
          link: "https://www.goodreads.com/book/show/15728212-fundamentals-of-remote-sensing",
        },
        {
          title: "Remote Sensing and Image Interpretation",
          author: "Lillesand, Kiefer, and Chipman",
          beginnerNote:
            "A classic textbook for beginners. Explains the entire remote sensing workflow with lots of images and examples. No advanced background required—just an interest in learning!",
          desc: "Highly cited textbook covering the complete remote sensing workflow, image acquisition, processing, and interpretation techniques.",
          img: "../BOOKS image/Remote Sensing Digital Image Analysis An Introduction.jpg",
          link: "https://www.goodreads.com/book/show/1814303.Remote_Sensing_and_Image_Interpretation",
        },
        {
          title: "Synthetic Aperture Radar Remote Sensing",
          author: "A. Moreira, D. Floricio",
          beginnerNote:
            "Good for those interested in advanced radar techniques. Starts with the basics of SAR, so motivated beginners can follow, especially if interested in geosciences or climate studies.",
          desc: "Advanced book on SAR techniques, data processing, and applications in geosciences, disaster monitoring, and climate studies.",
          img: "../BOOKS image/Introduction to Synthetic Aperture Radar (Sar) Polarimetry.jpg",
          link: "https://www.goodreads.com/book/show/15728214-synthetic-aperture-radar-remote-sensing",
        },
        {
          title: "Remote Sensing and GIS",
          author: "B. Bhatta",
          beginnerNote:
            "Covers both remote sensing and GIS from the ground up. Uses simple language, diagrams, and real-life case studies. Great for undergraduates and beginners in mapping and environmental monitoring.",
          desc: "This book integrates remote sensing with GIS, focusing on applications in urban planning, land use analysis, and environmental monitoring.",
          img: "../BOOKS image/Remote sensing and GIS.jpg",
          link: "https://www.goodreads.com/book/show/15728215-remote-sensing-and-gis",
        },
        {
          title: "Understanding GPS: Principles and Applications",
          author: "Elliott D. Kaplan, Christopher J. Hegarty",
          beginnerNote:
            "Explains GPS in a way that's accessible to beginners. You'll learn how GPS works, why it's important, and how it's used in navigation and mapping.",
          desc: "Detailed explanation of GPS fundamentals, signal structures, receiver design, and global navigation satellite systems.",
          img: "../BOOKS image/Applied Spatial Data Analysis with R.jpg",
          link: "https://www.goodreads.com/book/show/1814304.Understanding_GPS",
        },
        {
          title: "Digital Image Processing",
          author: "Rafael C. Gonzalez, Richard E. Woods",
          beginnerNote:
            "A foundational book for anyone interested in image processing. Starts with the basics and builds up, with clear explanations and practical examples.",
          desc: "Fundamentals and techniques in image processing including enhancement, restoration, segmentation, and compression.",
          img: "../BOOKS image/Introductory Digital Image Processing.jpg",
          link: "https://www.goodreads.com/book/show/1814305.Digital_Image_Processing",
        },
        {
          title: "Principles of Remote Sensing",
          author: "C. S. Agrawal & P. K. Garg",
          beginnerNote:
            "Introduces the theory and applications of remote sensing in a way that's easy for beginners to follow. No prior knowledge required.",
          desc: "Introduces the theoretical foundations and applications of remote sensing in natural resource management and mapping.",
          img: "../BOOKS image/principle of remote sensing.jpg",
          link: "https://www.goodreads.com/book/show/15728216-principles-of-remote-sensing",
        },
        {
          title: "Hyperspectral Remote Sensing",
          author: "Prem Chandra Pandey",
          beginnerNote:
            "Explains hyperspectral imaging from the basics, making it accessible to those new to the topic. Good for beginners interested in agriculture, forestry, or mineral exploration.",
          desc: "Explores advanced spectral imaging technologies and their applications in agriculture, forestry, and mineral exploration.",
          img: "../BOOKS image/Hyperspectral  rs.jpg",
          link: "https://www.goodreads.com/book/show/15728217-hyperspectral-remote-sensing",
        },
      ];

      function generateCards() {
        const container = document.getElementById("cardContainer");
        container.innerHTML = books
          .map(
            (book) => `
        <div class="card">
          <img src="${book.img}" alt="${book.title}">
          <div class="card-content">
            <div class="card-title">${book.title}</div>
            <div class="card-author">${book.author}</div>
            <div class="beginner-note" style="color:#1e90ff; font-size:0.97rem; margin-bottom:8px;"><b>Beginner's Note:</b> ${book.beginnerNote}</div>
            <div class="card-desc">
              ${book.desc.substring(0, 100)}<span class="more-text" style="display:none;">${book.desc.substring(100)}<br><a href="${book.link}" class="read-more-link" target="_blank">Read more on Goodreads</a></span>
            </div>
            <span class="read-more" onclick="toggleReadMore(this)">Read more</span>
          </div>
      </div>
      `
          )
          .join("");
      }

      function toggleReadMore(el) {
        const more = el.previousElementSibling.querySelector(".more-text");
        if (!more) return;
        more.style.display = more.style.display === "none" ? "inline" : "none";
        el.textContent =
          el.textContent === "Read more" ? "Read less" : "Read more";
      }

      function filterCards() {
        const term = document.getElementById("bookSearch").value.toLowerCase();
        document.querySelectorAll(".card").forEach((card) => {
          const txt = card.textContent.toLowerCase();
          card.style.display = txt.includes(term) ? "flex" : "none";
        });
      }

      window.onload = generateCards;
      
      // Handle image loading errors
      document.addEventListener('DOMContentLoaded', function() {
        const images = document.querySelectorAll('.card img');
        images.forEach(function(img) {
          img.addEventListener('load', function() {
            console.log('Image loaded successfully:', img.src);
            this.style.opacity = '1';
          });
          img.addEventListener('error', function() {
            console.error('Image failed to load:', img.src);
            this.style.opacity = '0.7';
            this.style.border = '2px dashed #dc3545';
            this.style.background = '#fff5f5';
            // Create a fallback text
            const fallback = document.createElement('div');
            fallback.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#dc3545;font-size:12px;text-align:center;pointer-events:none;';
            fallback.textContent = 'Cover Image\nNot Available';
            this.parentNode.style.position = 'relative';
            this.parentNode.appendChild(fallback);
          });
          img.style.opacity = '0.9';
          img.style.transition = 'opacity 0.3s ease';
        });
      });
    </script>
    <script type="module" src="/infi_website/Javascript/navBar.js"></script>
  </body>
</html>
