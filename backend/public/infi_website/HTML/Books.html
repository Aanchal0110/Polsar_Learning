ally, Section IV examines developments in the remote sensing of air, water, and other terrestrial features, reviews MODIS algorithms for aerosol retrieval at both global and local scales, and demonstrates the retrieval of aerosol optical thickness (AOT). This section rounds out coverage with a look at remote sensing approaches to measure the urban environment and examines the most important concepts and recent research.",

      function openModal(book) {
        const overlay = document.getElementById('descModal');
        const titleEl = document.getElementById('modalTitle');
        const authorEl = document.getElementById('modalAuthor');
        const bodyEl = document.getElementById('modalBody');
        const linkBtn = document.getElementById('modalLink');
        titleEl.textContent = book.title || '';
        authorEl.textContent = book.author || '';
        bodyEl.textContent = (book.desc || '').toString();
        if (book.link) {
          linkBtn.href = book.link;
          linkBtn.style.display = 'inline-block';
        } else {
          linkBtn.style.display = 'none';
        }
        overlay.style.display = 'flex';
      }

      function closeModal() {
        const overlay = document.getElementById('descModal');
        overlay.style.display = 'none';
      }

      function generateCards() {
        const container = document.getElementById("cardContainer");
        container.innerHTML = books
          .map((book, idx) => {
            const desc = (book.desc || "").toString();
            const shortDesc = desc.substring(0, 100);
            const restDesc = desc.substring(100);
            const hasMore = restDesc.length > 0;
            const beginnerNoteBlock = book.beginnerNote
              ? `<div class="beginner-note" style="color:#1e90ff; font-size:0.97rem; margin-bottom:8px;"><b>Beginner's Note:</b> ${book.beginnerNote}</div>`
              : "";
            const linkButton = book.link
              ? `<a href="${book.link}" class="btn" target="_blank" rel="noopener noreferrer">View details</a>`
              : "";
            return `
        <div class="card">
          <img src="${book.img || ''}" alt="${book.title || ''}">
          <div class="card-content">
            <div class="card-title">${book.title || ''}</div>
            <div class="card-author">${book.author || ''}</div>
            ${beginnerNoteBlock}
            <div class="card-desc">
              ${shortDesc}
            </div>
            <div class="card-actions">
              ${linkButton}
            </div>
          </div>
        </div>`;
          })
          .join("");
      }

      function toggleReadMore(el) {
        const more = el.previousElementSibling.querySelector(".more-text");
        if (!more) return;
        more.style.display = more.style.display === "none" ? "inline" : "none";
        el.textContent =
          el.textContent === "Read more" ? "Read less" : "Read more";
      }

      function filterCards() {
        const term = document.getElementById("bookSearch").value.toLowerCase();
        document.querySelectorAll(".card").forEach((card) => {
          const txt = card.textContent.toLowerCase();
          card.style.display = txt.includes(term) ? "flex" : "none";
        });
      }

      document.addEventListener('DOMContentLoaded', () => {
        generateCards();
        // Event delegation for detail buttons
        const container = document.getElementById('cardContainer');
        container.addEventListener('click', (e) => {
          const btn = e.target.closest('.view-details');
          if (!btn) return;
          const idx = Number(btn.getAttribute('data-index'));
          if (!Number.isNaN(idx) && books[idx]) {
            openModal(books[idx]);
          }
        });

        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.getElementById('descModal').addEventListener('click', (e) => {
          if (e.target.id === 'descModal') closeModal();
        });
      });
      
      // Handle image loading errors
      document.addEventListener('DOMContentLoaded', function() {
        const images = document.querySelectorAll('.card img');
        images.forEach(function(img) {
          img.addEventListener('load', function() {
            console.log('Image loaded successfully:', img.src);
            this.style.opacity = '1';
          });
          img.addEventListener('error', function() {
            console.error('Image failed to load:', img.src);
            this.style.opacity = '0.7';
            this.style.border = '2px dashed #dc3545';
            this.style.background = '#fff5f5';
            // Create a fallback text
            const fallback = document.createElement('div');
            fallback.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#dc3545;font-size:12px;text-align:center;pointer-events:none;';
            fallback.textContent = 'Cover Image\nNot Available';
            this.parentNode.style.position = 'relative';
            this.parentNode.appendChild(fallback);
          });
          img.style.opacity = '0.9';
          img.style.transition = 'opacity 0.3s ease';
        });
      });
    </script>
