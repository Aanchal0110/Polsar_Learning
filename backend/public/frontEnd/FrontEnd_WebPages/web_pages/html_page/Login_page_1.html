<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POLSAR Authentication</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-image: url("login2.jpg");
        background-size: cover;
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-position: center;
        color: #50237a;
      }

      #box {
        background-color: rgba(255, 255, 255, 0.9);
        width: 400px;
        padding: 40px 30px;
        border-radius: 10px;
        text-align: center;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      #box h2 {
        margin: 0 0 15px;
        color: #960d0d;
      }

      .text {
        height: 30px;
        border-radius: 5px;
        padding: 10px;
        border: 1px solid #ccc;
        width: 100%;
        margin-bottom: 15px;
        box-sizing: border-box;
        color: #333;
        background-color: #fff;
      }

      .button {
        padding: 12px 20px;
        width: 100%;
        color: white;
        background-color: #5a2360;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        transition: background-color 0.3s;
      }

      #button:hover {
        background-color: #3d1747;
      }

      #box a {
        color: #6a0dad;
        text-decoration: none;
        font-weight: bold;
        margin-top: 15px;
        display: inline-block;
        cursor: pointer;
      }

      .social-login {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
      }

      .social-login button {
        width: 32%;
        padding: 10px;
        font-size: 14px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      .google {
        background-color: #dd4b39;
        color: white;
      }

      .microsoft {
        background-color: #2b579a;
        color: white;
      }

      .apple {
        background-color: black;
        color: white;
      }

      /* Form visibility controls */
      .form-container {
        display: none;
      }

      .form-container.active {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="box">
      <h2 id="formTitle">Login</h2>

      <!-- Login Form -->
      <div id="loginForm" class="form-container active">
        <form method="post" action="/login">
          <input
            class="text"
            type="text"
            name="email_id"
            placeholder="Enter Your Email"
            required
            id="login_email"
          />
          <br />
          <input
            class="text"
            type="password"
            name="pass_word"
            placeholder="Enter Password"
            required
            id="login_password"
          />
          <br />
          <input id="login_button" class="button" value="_Login_" />
          <br />
        </form>
        <a id="showSignup">Click to Signup</a>
        <p id="loginMessage" style="color: red"></p>
      </div>

      <!-- Signup Form -->
      <div id="signupForm" class="form-container">
        <form method="post" action="/signIn_Triggerd">
          <input
            class="text"
            type="text"
            name="first_name"
            placeholder="Enter First Name"
            required
          />
          <br />
          <input
            class="text"
            type="text"
            name="last_name"
            placeholder="Enter Last Name"
            required
          />
          <br />
          <input
            class="text"
            type="email"
            name="email"
            placeholder="Enter Email"
            required
          />
          <br />
          <input
            class="text"
            type="tel"
            name="phone"
            placeholder="Enter Phone"
            pattern="[0-9]{10}"
            required
            title="Phone number must be 10 digits"
          />
          <br />
          <input
            class="text"
            type="password"
            name="password"
            placeholder="Enter Password"
            minlength="8"
            required
            pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[\W_]).{8,}"
            title="Must contain at least one number, one uppercase and lowercase letter, and one special character."
          />
          <br />
          <input class="button" value="Signup" />
          <br />
        </form>
        <a id="showLogin">Click to Login</a>
      </div>

      <!-- Social Login Buttons -->
      <div class="social-login">
        <button class="google" id="googleLogin">Google</button>
        <button class="microsoft" id="microsoftLogin">Microsoft</button>
        <button class="apple" id="appleLogin">Apple</button>
      </div>
    </div>

    <!-- Firebase SDKs -->
    <script>
      console.log("___------>");
    </script>
  </body>

</html>
