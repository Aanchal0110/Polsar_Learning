<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Create Blog Post</title>
  </head>
  <body>
    <h2>Create a New Blog Post</h2>

    <form id="postForm">
      <label for="title">Title:</label><br />
      <input type="text" id="title" name="title" required /><br /><br />

      <label for="content">Content (Raw HTML):</label><br />
      <textarea id="content" name="content" rows="10" cols="60" required>
<h1>My Blog Title</h1>
<p>This is a <strong>raw HTML</strong> blog post.</p>
    </textarea
      ><br /><br />

      <label for="coverImage">Cover Image:</label><br />
      <input
        type="file"
        id="coverImage"
        name="coverImage"
        accept="image/*"
        required
      /><br /><br />

      <button type="submit">Submit</button>
    </form>

    <script>
      document
        .getElementById("postForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const formData = new FormData();
          formData.append("title", document.getElementById("title").value);
          formData.append("content", document.getElementById("content").value);
          formData.append(
            "coverImage",
            document.getElementById("coverImage").files[0]
          );

          // Replace with your real JWT token
          const token =
            "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1aWQiOiI1YTk2ZDljZi0xMzJhLTRkYTQtOGRjYi1kZmQ2N2IwMjAwMWIiLCJlbWFpbCI6ImFkZHUxQGdtYWlsLmNvbSIsImlhdCI6MTc0ODg3MDYzMCwiZXhwIjoxNzQ4ODc0MjMwfQ.Eq-tBntEHdpE9un4FQp0VQ981Rds7lmtL4owVtYJfVk";

          try {
            const response = await fetch("/post", {
              method: "POST",
              headers: {
                Authorization: token,
              },
              body: formData,
            });

            const result = await response.json();
            console.log(result);

            if (response.ok) {
              alert("Blog post created successfully!");
            } else {
              alert("Failed: " + result.error);
            }
          } catch (err) {
            console.error(err);
            alert("Error occurred while creating the post.");
          }
        });
    </script>
    <script src="/infi_website/js/chatbot-widget.js" defer></script>
</body>
</html>
